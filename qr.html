<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>LUSH Logistics 설치 QR</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f5f2;color:#1d1d1b;font-family:"Pretendard","Noto Sans KR",Arial,sans-serif}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(520px,100%);background:#fff;border:1px solid #e2e2de;border-radius:18px;padding:30px;text-align:center}
    h1{margin:0;font-size:24px;letter-spacing:-.04em}
    p{margin:10px 0 0;color:#74746f;font-size:13px;line-height:1.65}
    .qr{width:min(320px,80vw);aspect-ratio:1;margin:24px auto 14px;border:1px solid #e2e2de;border-radius:16px;padding:12px;background:#fff}
    .qr img{width:100%;height:100%;display:block}
    .url{margin-top:10px;word-break:break-all;color:#888;font-size:10px;line-height:1.5}
    .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
    .btn{height:42px;padding:0 16px;border:1px solid #d9d9d4;border-radius:9px;background:#fff;color:#1d1d1b;font-weight:800;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .btn.primary{background:#111;color:#fff;border-color:#111}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>LUSH Logistics 설치 QR</h1>
      <p>휴대폰 카메라로 스캔하면 Android / iOS 설치 안내 페이지가 열립니다.</p>
      <div class="qr"><img id="qrImage" alt="LUSH Logistics 설치 QR 코드"></div>
      <div class="url" id="qrTarget"></div>
      <div class="actions">
        <button class="btn primary" type="button" id="downloadQr">QR 이미지 저장</button>
        <a class="btn" href="./install.html">설치 안내 보기</a>
      </div>
    </section>
  </main>
  <script>
    const target=new URL('./install.html',window.location.href).href;
    document.getElementById('qrTarget').textContent=target;
    const qrSrc='https://api.qrserver.com/v1/create-qr-code/?size=640x640&margin=12&data='+encodeURIComponent(target);
    document.getElementById('qrImage').src=qrSrc;
    document.getElementById('downloadQr').addEventListener('click',async function(){
      try{
        const res=await fetch(qrSrc);
        const blob=await res.blob();
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download='LUSH-Logistics-install-QR.png';
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
      }catch(e){
        window.open(qrSrc,'_blank');
      }
    });
  </script>
</body>
</html>
