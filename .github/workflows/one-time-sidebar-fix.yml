name: One-time desktop sidebar refresh fix

on:
  push:
    paths:
      - ".github/workflows/one-time-sidebar-fix.yml"

permissions:
  contents: write

jobs:
  fix-sidebar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch desktop sidebar refresh behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = 'id="desktop-sidebar-refresh-fix"'
          if marker in text:
              print("Patch already present.")
              raise SystemExit(0)

          patch = r'''
<script id="desktop-sidebar-refresh-fix">
(function () {
  function syncDesktopSidebarStyle() {
    var legacyTopnav = document.getElementById('v70-dark-topnav');
    if (!legacyTopnav) return;
    legacyTopnav.disabled = window.matchMedia('(min-width: 901px)').matches;
  }

  syncDesktopSidebarStyle();
  window.addEventListener('resize', syncDesktopSidebarStyle, { passive: true });
})();
</script>
'''

          if "</body>" not in text:
              raise SystemExit("Could not find </body> in index.html")

          text = text.replace("</body>", patch + "\n</body>", 1)
          path.write_text(text, encoding="utf-8")
          print("Patched index.html")
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix desktop sidebar layout after refresh"
          git push origin HEAD:main
