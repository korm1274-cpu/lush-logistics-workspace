name: Build Android Fold test APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-test
    steps:
      - name: Check out isolated Android test branch
        uses: actions/checkout@v4
        with:
          ref: test/android-fold-apk
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK from runner
        run: |
          set -eu
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon "-PlushSiteUrl=https://lush-logistics-workspace.vercel.app/"
      - name: Verify APK manifest, signature and SHA-256
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee /tmp/lush-permissions.txt
          python3 - <<'PY'
          import re
          text=open('/tmp/lush-permissions.txt').read()
          permissions=set(re.findall(r'android\.permission\.[A-Z_]+', text))
          if permissions != {'android.permission.INTERNET'}:
              raise SystemExit(f'Unexpected APK permissions: {sorted(permissions)}')
          PY
          "$AAPT" dump badging "$APK" | tee /tmp/lush-badging.txt
          grep -q "package: name='kr.co.lush.logistics.foldtest'" /tmp/lush-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/lush-manifest.txt
          if grep -A 2 'android:debuggable' /tmp/lush-manifest.txt | grep -q '0xffffffff'; then
            echo "APK is debuggable"; exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/lush-signature.txt
          mkdir -p security-report
          sha256sum "$APK" | tee security-report/SHA256SUMS.txt
          git rev-parse HEAD | tee security-report/SOURCE_COMMIT.txt
          printf "TEST APK: automatically debug-signed, not a production identity. Do not disable Play Protect.\\n" | tee security-report/README.txt
          cp /tmp/lush-permissions.txt /tmp/lush-signature.txt /tmp/lush-badging.txt security-report/
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: lush-logistics-fold-security-report
          path: android-test/security-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: lush-logistics-fold-debug-apk
          path: android-test/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
