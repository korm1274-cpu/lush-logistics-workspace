 12px;border:1px solid #dfe6df;border-radius:10px}.racks{display:grid;grid-template-columns:35px repeat(3,1fr);gap:7px;align-items:center}.rack{padding:12px 3px;border:1px solid #d7e1da;border-radius:8px;text-align:center;background:#f1f3f1;font-size:12px}.rack.pick{background:#e5f7eb;border-color:#bce2c7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border-radius:12px;background:#f3f6f3;padding:16px 10px}.stat b{display:block;font-size:24px}.stat small{color:#758078}.notes li{padding:6px 0;line-height:1.5;font-size:13px}.flash{background:#e5f6e9;color:#256f45;padding:10px 12px;border-radius:9px;font-size:13px}.alert{background:#fff1dc;color:#845518;padding:10px 12px;border-radius:9px;font-size:13px}.foot{margin-top:20px;color:#6e7a72;font-size:12px}.divider{border:0;border-top:1px solid #e8ece9;margin:17px 0}
@media(max-width:850px){.shell{padding:15px}.layout{grid-template-columns:1fr}.panel{padding:15px}.top{align-items:flex-start}.headline h1{font-size:23px}.tabs{display:grid;grid-template-columns:repeat(3,1fr)}.tab{padding:10px 5px;font-size:12px}.stats{gap:5px}.stat{padding:12px 6px}.stat b{font-size:19px}}

<body><div class="shell">
<header class="top"><div class="brand"><strong>LUSH</strong><small>LOGISTICS WORKSPACE · SIMULATION</small></div><a href="/">← 기존 웹사이트로 돌아가기</a></header>
<div class="headline"><h1>물류 전산 고도화 시뮬레이션</h1><span class="tag">PROTOTYPE · TEST ONLY</span></div>
<div class="warning"><b>운영 환경과 분리된 데모</b> — 예시 제품·매장·수량만 사용합니다. ERP, DAS, 실재고, 출고 전표에는 어떠한 변경도 전송하지 않습니다. 화면을 새로고침하면 테스트 상태가 초기화됩니다.</div>
<nav class="tabs" id="tabs"></nav>
<div class="layout"><main id="main" class="panel"></main><aside class="panel" id="aside"></aside></div>
<footer class="foot">화면·데이터는 요구사항 협의용 임시 시안입니다. 실제 PDA 바코드 스캔은 이 데모에서 텍스트 입력으로 대체합니다.</footer>
</div>
<script>
(function(){
"use strict";
const shops=[{id:"S01",name:"강남점",a:20,b:10,c:5},{id:"S02",name:"홍대점",a:15,b:10,c:10},{id:"S03",name:"잠실점",a:15,b:10,c:5}];
const skus=[{id:"a",code:"SKU-A",name:"제품 A",loc:"A1-01-01",zone:"A1"},{id:"b",code:"SKU-B",name:"제품 B",loc:"A1-02-01",zone:"A1"},{id:"c",code:"SKU-C",name:"제품 C",loc:"B1-01-01",zone:"B1"}];
const backup=[{loc:"A1-01-02",sku:"a",level:2,qty:120},{loc:"A1-02-03",sku:"a",level:3,qty:80},{loc:"B1-03-04",sku:"a",level:4,qty:35},{loc:"A1-02-02",sku:"b",level:2,qty:90},{loc:"B1-02-03",sku:"c",level:3,qty:70}];
const pages=[["orders","① 출고 작업"],["pick","② PDA 피킹"],["locations","③ 로케이션"],["das","④ DAS 분류"],["boxes","⑤ 박스·출고"],["status","⑥ 작업 현황"]];
let s;
function reset(){s={page:"orders",selected:["S01","S02","S03"],created:false,sent:false,zone:null,detail:null,scan:"",quantity:"",pick:{},das:{},boxes:{},stockAdjust:0,log:[],message:""};render()}
function e(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function chosen(){return shops.filter(x=>s.selected.includes(x.id))}
function total(key){return chosen().reduce((n,x)=>n+x[key],0)}
function picked(x){return Object.prototype.hasOwnProperty.call(s.pick,x.id)?s.pick[x.id]:null}
function pickFinished(){return skus.every(x=>total(x.id)===0||picked(x)!==null)}
function shopFinished(){return chosen().every(x=>s.das[x.id])}
function log(t){s.log.unshift(t);s.log=s.log.slice(0,15)}
function button(text,act,kind="",disabled=false){return '<button class="btn '+kind+'" data-action="'+act+'" '+(disabled?"disabled":"")+'>'+text+'</button>'}
function openPage(p){s.page=p;s.message="";render()}
function render(){
document.getElementById("tabs").innerHTML=pages.map(p=>'<button class="tab '+(s.page===p[0]?"active":"")+'" data-page="'+p[0]+'">'+p[1]+'</button>').join("");
let main="",side="";
if(s.page==="orders"){
main='<h2>ERP 출고지시 → 피킹 작업 생성</h2><p class="muted">사무실에서 출고 대상 매장 주문을 선택하면 SKU별 총량을 합산하여 PDA 작업으로 전달하는 과정입니다.</p><div class="mini"><b>출고 관리 → 출고지시(본사)</b><p class="muted">시뮬레이션용 가상 주문 목록</p></div><div class="stack" style="margin-top:15px">'+shops.map(x=>'<label class="card row"><span><input type="checkbox" data-shop="'+x.id+'" '+(s.selected.includes(x.id)?"checked":"")+' '+(s.created?"disabled":"")+' /> <b>'+x.name+'</b></span><span class="muted">'+(x.a+x.b+x.c)+' EA</span></label>').join("")+'</div><div class="tools">'+button(s.created?"피킹 작업 생성 완료":"선택 주문으로 피킹 작업 생성","create","green",s.created||!s.selected.length)+button(s.sent?"DAS 주문 전송 완료":"DAS 주문 전송 (모의)","send","secondary",!s.created||s.sent)+'</div>'+(s.created?'<div class="flash">피킹 작업이 생성되었습니다. PDA 메뉴에서 Zone별 지시 내역을 확인할 수 있습니다.</div>':'');
side='<h3>SKU별 총량 자동 집계</h3><table class="table"><thead><tr><th>제품</th><th>로케이션</th><th>지시</th></tr></thead><tbody>'+skus.map(x=>'<tr><td>'+x.name+'</td><td>'+x.loc+'</td><td>'+total(x.id)+' EA</td></tr>').join("")+'</tbody></table><p class="hint">실제 구현에서는 ERP 주문의 SKU·매장 식별값과 로케이션 마스터를 연결해야 합니다. 이 화면의 전송 버튼은 실제 DAS에 연결되지 않습니다.</p>';
}
if(s.page==="pick"){
main='<h2>작업자 PDA 피킹</h2><p class="muted">Zone 리스트 선택 → 로케이션 스캔 → 상세 화면 → 수량 확정 → 자동 목록 복귀</p><div class="pda">';
if(!s.created){main+='<div class="pda-header"><strong>피킹 작업 대기</strong></div><p class="muted">출고 작업 메뉴에서 피킹 작업을 먼저 생성해 주세요.</p>'+button("출고 작업으로 이동","goto-orders");}
else if(!s.zone){main+='<div class="pda-header"><strong>피킹 지역 선택</strong><small>지역별 진행 현황</small></div><div class="stack">'+["A1","B1"].map(z=>{const xs=skus.filter(x=>x.zone===z&&total(x.id)>0),n=xs.filter(x=>picked(x)!==null).length;return '<button class="card click" data-zone="'+z+'"><div class="row"><b>'+z+' Zone</b><span class="status '+(n===xs.length?"good":n?"warn":"")+'">'+(n===xs.length?"완료":n?"진행 중":"대기")+'</span></div><div class="muted">'+n+'/'+xs.length+'개 로케이션 확정</div><div class="bar"><span style="width:'+(xs.length?n/xs.length*100:100)+'%"></span></div></button>'}).join("")+'</div>'}
else if(!s.detail){const xs=skus.filter(x=>x.zone===s.zone&&total(x.id)>0);
main+='<div class="pda-header row"><div><strong>'+s.zone+' Zone 피킹리스트</strong><small>목록 확인 후 로케이션 스캔</small></div><button class="btn secondary" data-action="back-zone">지역 선택</button></div><div class="field"><label>로케이션 바코드 (시연용 직접 입력)</label><div class="scanline"><input id="scanCode" value="'+e(s.scan)+'" placeholder="예: '+xs[0]?.loc+'" autocomplete="off"/>'+button("스캔","scan")+'</div></div><div class="location-list">'+xs.map(x=>{const val=picked(x);return '<button class="location-item '+(val!==null?"done":"")+'" data-fill="'+x.loc+'"><div class="row"><b>'+x.loc+'</b><span class="status '+(val!==null?(val===total(x.id)?"good":"warn"):"")+'">'+(val===null?"대기":val===total(x.id)?"완료":"부족 확정")+'</span></div><div class="row"><span class="name">'+x.name+'</span><strong class="number">'+(val??0)+'/'+total(x.id)+'</strong></div></button>'}).join("")+'</div><p class="hint">항목을 누르면 스캔 입력 칸에 코드만 채워집니다. 스캔 버튼으로 상세 화면에 진입합니다.</p>';
}else{const x=skus.find(x=>x.id===s.detail),n=total(x.id),v=Number(s.quantity),ok=s.quantity.trim()!==""&&Number.isInteger(v)&&v>=0&&v<=n,short=ok?n-v:0,alternatives=backup.filter(b=>b.sku===x.id);
main+='<div class="pda-header row"><div><strong>로케이션 상세 피킹</strong><small>스캔 위치 · 파렛트랙 1단</small></div>'+button("뒤로","back-list","secondary")+'</div><div class="card selected"><div class="muted">로케이션</div><h2>'+x.loc+'</h2><b>'+x.name+'</b><div class="bigqty">'+(ok?v:0)+'/'+n+' <span class="small">EA</span></div><div class="field"><label>실제 피킹 수량</label><input id="pickQuantity" type="number" min="0" max="'+n+'" step="1" value="'+e(s.quantity)+'" /></div>'+(ok&&short>0?'<div class="alert">부족 수량 '+short+' EA</div><h3 style="margin-top:15px">동일 제품의 다른 보관 로케이션</h3><div class="stack">'+(alternatives.length?alternatives.map(b=>'<div class="stock row"><div><b>'+b.loc+'</b><div class="muted">'+b.level+'단 보관</div></div><strong>'+b.qty+' EA</strong></div>').join(""):'<div class="hint">등록된 다른 보관 위치 없음</div>')+'</div>':'')+'<div class="tools">'+button("피킹 수량 확정 → 리스트 복귀","confirm","green",!ok)+'</div>'+(ok&&short>0?'<div class="hint">부족 수량은 확정 상태로 남습니다. 재피킹·보충 이동의 처리 기준은 추후 결정합니다.</div>':'')+'</div>';
}
main+='</div>';
side='<h3>작업 상태</h3><div class="stack">'+skus.map(x=>'<div class="card row"><span>'+x.name+'<br><span class="muted">'+x.loc+'</span></span><b>'+(picked(x)??0)+'/'+total(x.id)+'</b></div>').join("")+'</div><p class="hint">실제 PDA에서는 스캐너를 통한 로케이션 인식 및 자동 화면 전환을 적용하고, 이 웹 시안에서는 텍스트 입력으로 동작을 검증합니다.</p>';
}
if(s.page==="locations"){
main='<h2>로케이션·재고 관리</h2><p class="muted">1단은 피킹, 2~4단은 보관 로케이션으로 구분합니다.</p><div class="racks">'+[4,3,2,1].map(l=>'<span class="muted">'+l+'단</span>'+[1,2,3].map(n=>'<div class="rack '+(l===1?"pick":"")+'"><b>A1-0'+n+'-0'+l+'</b><br>'+(l===1?"피킹":"보관")+'</div>').join("")).join("")+'</div><hr class="divider"/><h3>제품 A · 다른 보관 로케이션</h3><div class="stack">'+backup.filter(x=>x.sku==="a").map(x=>'<div class="stock row"><span>'+x.loc+' <small class="muted">('+x.level+'단)</small></span><b>'+x.qty+' EA</b></div>').join("")+'</div>';
side='<h3>로케이션 관리 테스트</h3><p class="muted">실제 재고 이동은 처리하지 않습니다. 부족 수량 발생 시 다른 보관 위치를 조회하는 목적의 데이터 예시입니다.</p><div class="mini">로케이션별 전산 재고가 구축되어야 실재고 조회가 가능합니다.</div>';
}
if(s.page==="das"){
main='<h2>DAS 매장별 분류 · 모의 동작</h2><p class="muted">업체 설비의 실제 화면이 아니라, 주문 수신 및 매장별 분류 결과를 시연하는 화면입니다.</p>'+(s.sent?'<div class="flash">가상 DAS 주문 수신 완료</div>':'<div class="alert">출고 작업 메뉴에서 DAS 주문 전송(모의)을 먼저 진행해 주세요.</div>')+'<div class="stack" style="margin-top:14px">'+chosen().map(x=>'<div class="card"><div class="row"><b>'+x.name+'</b><span class="status '+(s.das[x.id]?"good":"")+'">'+(s.das[x.id]?"분류 완료":"분류 대기")+'</span></div><p class="muted">제품 A '+x.a+'EA · B '+x.b+'EA · C '+x.c+'EA</p>'+button(s.das[x.id]?"완료됨":"매장별 분류 완료(시연)","das-"+x.id,"secondary",!s.sent||s.das[x.id])+'</div>').join("")+'</div>';
side='<h3>연동 설명</h3><p class="muted">DAS 시스템에는 매장별 주문 수량이 전달되고, PDA에는 전체 SKU 합산 수량이 제공됩니다.</p><div class="mini">실제 분류 완료 정보·박스 ID·내품 데이터의 규격은 DAS 업체와 협의가 필요합니다.</div>';
}
if(s.page==="boxes"){
const eligible=chosen().filter(x=>s.das[x.id]);
main='<h2>박스·패킹·출고 시연</h2><p class="muted">DAS 완료 매장의 가상 박스와 내품을 확인하고 패킹 상태를 변경합니다.</p>'+(eligible.length?'<div class="stack">'+eligible.map(x=>'<div class="card"><div class="row"><b>BOX-'+x.id+'</b><span class="status '+(s.boxes[x.id]?"good":"")+'">'+(s.boxes[x.id]?"패킹 완료":"패킹 대기")+'</span></div><p class="muted">'+x.name+' · 제품 A '+x.a+'EA / B '+x.b+'EA / C '+x.c+'EA</p>'+button(s.boxes[x.id]?"완료됨":"박스 패킹 완료(시연)","box-"+x.id,"secondary",!!s.boxes[x.id])+'</div>').join("")+'</div>':'<div class="alert">DAS 분류 완료된 매장이 아직 없습니다.</div>');
side='<h3>박스 정보 활용</h3><p class="muted">매장코드·매장명·박스 번호·투입 제품과 수량을 조회하는 시뮬레이션입니다.</p><div class="mini">실제 ERP 출고 확정 또는 매장 수령 처리는 실행되지 않습니다.</div>';
}
if(s.page==="status"){
const pn=skus.filter(x=>total(x.id)>0).length,pc=skus.filter(x=>total(x.id)>0&&picked(x)!==null).length,dc=chosen().filter(x=>s.das[x.id]).length,bc=chosen().filter(x=>s.boxes[x.id]).length;
main='<h2>전체 작업 현황판</h2><p class="muted">모든 파트에서 실행한 가상 작업 상태를 한눈에 확인합니다.</p><div class="stats"><div class="stat"><small>피킹 확정</small><b>'+pc+'/'+pn+'</b></div><div class="stat"><small>DAS 분류</small><b>'+dc+'/'+chosen().length+'</b></div><div class="stat"><small>박스 패킹</small><b>'+bc+'/'+chosen().length+'</b></div></div><h3 style="margin-top:23px">작업 이력</h3><div class="stack">'+(s.log.length?s.log.map(x=>'<div class="card muted">'+e(x)+'</div>').join(""):'<p class="hint">아직 시뮬레이션 작업 이력이 없습니다.</p>')+'</div>';
side='<h3>작업 개요</h3><div class="stack"><div class="card row"><span>출고 작업</span><b>'+(s.created?"생성 완료":"대기")+'</b></div><div class="card row"><span>DAS 주문</span><b>'+(s.sent?"전송(모의)":"대기")+'</b></div><div class="card row"><span>피킹</span><b>'+(pickFinished()?"전 항목 확정":"진행 중 / 대기")+'</b></div></div><p class="hint">부분 피킹 확정은 정상 전량 피킹과 구분되어야 합니다.</p>';
}
document.getElementById("main").innerHTML=main;
document.getElementById("aside").innerHTML=side+'<hr class="divider"/>'+button("시뮬레이션 전체 초기화","reset","secondary")+'<p class="hint">테스트용 세션 데이터는 현재 화면에서만 유지되며 운영 서버에 저장되지 않습니다.</p>';
if(s.page==="pick"&&s.zone&&!s.detail){const el=document.getElementById("scanCode");if(el)el.focus()}
}
document.addEventListener("click",ev=>{
const page=ev.target.closest("[data-page]");if(page){openPage(page.dataset.page);return}
const z=ev.target.closest("[data-zone]");if(z){s.zone=z.dataset.zone;render();return}
const fill=ev.target.closest("[data-fill]");if(fill){const input=document.getElementById("scanCode");if(input){input.value=fill.dataset.fill;s.scan=input.value;input.focus()}return}
const act=ev.target.closest("[data-action]");if(!act)return;
const a=act.dataset.action;
if(a==="reset"){reset();return}
if(a==="goto-orders"){openPage("orders");return}
if(a==="create"){s.created=true;log("출고 작업 생성 · "+s.selected.length+"개 매장");render();return}
if(a==="send"){s.sent=true;log("DAS 주문 전송(모의)");render();return}
if(a==="back-zone"){s.zone=null;render();return}
if(a==="back-list"){s.detail=null;render();return}
if(a==="scan"){const raw=(document.getElementById("scanCode")?.value||"").trim().toUpperCase();const x=skus.find(x=>x.loc===raw&&x.zone===s.zone&&total(x.id)>0);if(!x){alert("현재 Zone 피킹 대상에 없는 로케이션입니다.");return}s.scan=raw;s.detail=x.id;s.quantity=String(picked(x)??0);render();return}
if(a==="confirm"){const x=skus.find(x=>x.id===s.detail);if(!x)return;const input=document.getElementById("pickQuantity");const raw=input?.value??"";const v=Number(raw),t=total(x.id);if(!raw.trim()||!Number.isInteger(v)||v<0||v>t)return;s.pick[x.id]=v;log(x.loc+" · "+v+"/"+t+" EA 피킹 확정");s.detail=null;s.scan="";render();return}
if(a.startsWith("das-")){const id=a.slice(4);if(!s.sent||!s.selected.includes(id))return;s.das[id]=true;log("DAS 매장별 분류 완료 · "+shops.find(x=>x.id===id).name);render();return}
if(a.startsWith("box-")){const id=a.slice(4);if(!s.das[id])return;s.boxes[id]=true;log("가상 박스 패킹 완료 · BOX-"+id);render();return}
});
document.addEventListener("change",ev=>{if(ev.target.matches("[data-shop]")&&!s.created){const id=ev.target.dataset.shop;s.selected=ev.target.checked?[...s.selected,id]:s.selected.filter(x=>x!==id);render()}});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="scanCode"){ev.preventDefault();document.querySelector('[data-action="scan"]')?.click()}});
reset();
})();
</script></body></html>
