<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="LUSH Logistics">
  <rect width="128" height="128" fill="#4bc293"/>
  <!-- Artwork fully inset inside maskable safe zone; rounded inner image prevents square edge cutoff. -->
  <defs><clipPath id="safe-art"><rect x="32" y="32" width="64" height="64" rx="16" ry="16"/></clipPath></defs>
  <image x="32" y="32" width="64" height="64" clip-path="url(#safe-art)" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
</svg>